name: build to deploy branch

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-branch
  cancel-in-progress: true

jobs:
  build_to_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install deps
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Publish dist to deploy branch
        env:
          DEPLOY_BRANCH: deploy
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin "${DEPLOY_BRANCH}:${DEPLOY_BRANCH}" || true

          git switch "${DEPLOY_BRANCH}" 2>/dev/null || git checkout -b "${DEPLOY_BRANCH}"

          git rm -r --ignore-unmatch .

          rsync -av --delete \
            --filter='P .git/' \
            --filter='P .github/' \
            dist/ ./ || { code=$?; echo "rsync failed with exit $code"; exit $code; }


          touch .nojekyll

          if git status --porcelain | grep -q .; then
            git add -A
            git commit -m "Deploy: ${GITHUB_SHA}"
            git push origin "${DEPLOY_BRANCH}"
          else
            echo "No changes to deploy."
          fi

